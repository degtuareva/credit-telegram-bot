spring:
  profiles:
    active: postgres

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/credit_bot}
    username: ${DB_USERNAME:credit_user}
    password: ${DB_PASSWORD:credit_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

telegram:
  bot:
    username: ${TELEGRAM_BOT_USERNAME:credit_olga_telegram_bot}
    token: ${TELEGRAM_BOT_TOKEN}

  manager-password: ${TELEGRAM_MANAGER_PASSWORD}
  manager-ids: ${TELEGRAM_MANAGER_IDS:539942281}